<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Neon Snake — Slither Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="stat"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
  <div class="stat"><span class="label">LENGTH</span><span class="value" id="length">10</span></div>
  <div class="stat"><span class="label">RANK</span><span class="value" id="rank">—</span></div>
</div>

<div class="leaderboard" id="leaderboard"></div>

<div class="overlay" id="startScreen">
  <h1>NEON<span>SNAKE</span></h1>
  <p>Move with your mouse, touch, or WASD / arrow keys • Eat glowing orbs to grow • Avoid other snakes &amp; the arena wall</p>
  <button id="playBtn">PLAY</button>
</div>

<div class="overlay hidden" id="gameOver">
  <h1>GAME OVER</h1>
  <p>Score: <span id="finalScore" style="color:#00e5ff;font-weight:700">0</span></p>
  <button id="restartBtn">PLAY AGAIN</button>
</div>

<div class="hint" id="hint">MOVE MOUSE TO STEER</div>

<script src="script.js"></script>
</body>
</html>
